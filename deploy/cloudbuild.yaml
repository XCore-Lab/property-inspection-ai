# Cloud Build: the APP image (code only) on top of the base image. Used by deploy/deploy.sh on every deploy:
#   gcloud builds submit --config deploy/cloudbuild.yaml --ignore-file deploy/app.gcloudignore \
#     --substitutions _IMAGE=<region>-docker.pkg.dev/<project>/<repo>/property-inspection-ai:latest,_BASE_IMAGE=<same>:base .
# The base layers already exist in the registry, so only the few-MB code layers are pushed.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--build-arg", "BASE_IMAGE=${_BASE_IMAGE}", "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
options:
  machineType: E2_HIGHCPU_8       # faster pull of the ~12 GB base image
  diskSizeGb: 100
timeout: 1800s
