# Cloud Build: pull Google_Hackathon_v1.zip from Google Drive INSIDE Google Cloud (nothing goes through a laptop),
# stage models/ (~9 GB) in the build bucket for deploy/cloudbuild-base.yaml, and park backend/models/*.py (missing
# from git, see .gitignore) next to it. Replaces deploy/stage_models.sh when the weights are not on the local machine.
#   gcloud builds submit --no-source --config deploy/cloudbuild-fetch-models.yaml \
#     --substitutions _DRIVE_ID=<Drive file id>,_BUILD_BUCKET=<project>-property-inspection-build
# deploy/deploy_lowcost.sh runs it on the first deploy.
substitutions:
  _DRIVE_ID: ""
  _BUILD_BUCKET: ""
steps:
  - name: python:3.11-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip >/dev/null
        pip install -q gdown
        gdown "${_DRIVE_ID}" -O /workspace/bundle.zip     # a bare file id; gdown handles the large-file confirm page
        ls -lh /workspace/bundle.zip
        unzip -l /workspace/bundle.zip | grep -E "/models/" | head -60 || true     # layout (|| true: head closes the pipe)
        # only the weights (+ the code folder missing from git); the 2 GB Windows bin/ and the rest stay in the zip
        unzip -q /workspace/bundle.zip '*models/*' -d /workspace/x
        MODELS=$$(find /workspace/x -maxdepth 2 -type d -name models -not -path '*/backend/*' | head -1)
        [ -n "$$MODELS" ] || { echo "no models/ folder in the zip"; exit 1; }
        mv "$$MODELS" /workspace/models
        mkdir -p /workspace/code-backend-models
        cp "$$(dirname "$$MODELS")"/backend/models/*.py /workspace/code-backend-models/ || echo "no backend/models/*.py in the zip"
        rm -f /workspace/bundle.zip
        du -sh /workspace/models
        find /workspace/models -maxdepth 4 | sort
        ls -la /workspace/code-backend-models
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud storage rsync --recursive /workspace/models "gs://${_BUILD_BUCKET}/models"
        gcloud storage cp /workspace/code-backend-models/*.py "gs://${_BUILD_BUCKET}/code/backend-models/" || true
        gcloud storage ls -r "gs://${_BUILD_BUCKET}/" | head -80 || true
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
timeout: 7200s
