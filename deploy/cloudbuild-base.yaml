# Cloud Build: the BASE image (GPU binaries + torch + model weights, Dockerfile.base). Rarely needed:
# deploy/deploy.sh builds it on the first deploy or with BUILD_BASE=1.
# The weights are NOT in the uploaded source (deploy/base.gcloudignore skips models/): deploy/stage_models.sh
# uploads them once to a bucket (resumable), and the first step copies them in from there.
#   gcloud builds submit --config deploy/cloudbuild-base.yaml --ignore-file deploy/base.gcloudignore \
#     --substitutions _BASE_IMAGE=<region>-docker.pkg.dev/<project>/<repo>/property-inspection-ai:base,_MODELS=gs://<bucket>/models .
substitutions:
  _CUDA_ARCHS: "89"     # L4 only (halves the CUDA compile vs "86;89"; local RTX 30xx builds use the Dockerfile default)
  _JOBS: ""             # parallel compile jobs ("" = all CPUs)
steps:
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args: ["-c", "mkdir -p models && gcloud storage rsync --recursive '${_MODELS}' models && du -sh models"]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "Dockerfile.base", "--build-arg", "CUDA_ARCHS=${_CUDA_ARCHS}", "--build-arg", "JOBS=${_JOBS}",
           "-t", "${_BASE_IMAGE}", "."]
images: ["${_BASE_IMAGE}"]
options:
  machineType: E2_HIGHCPU_32      # compiles llama.cpp + locate-anything.cpp with CUDA (free trial: deploy.sh BASE_MACHINE=E2_HIGHCPU_8)
  diskSizeGb: 200
timeout: 10800s
